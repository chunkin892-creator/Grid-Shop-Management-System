<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>格仔鋪營運管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Firebase Compat 版本，避免 import 錯誤 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gold: '#D4AF37',
          'gold-light': '#F5E6A3',
          midnight: '#0A0A0F',
        },
      },
    },
  };
</script>
<style>
  body { background: #0A0A0F; color: #fff; font-family: 'Inter', 'Noto Sans HK', sans-serif; margin: 0; }
  .glass-card { border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0A0A0F; }
  ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
  input, select, textarea { color-scheme: dark; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, createContext, useContext } = React;

/* ============================================================
   1. Firebase 配置（正確 Compat 寫法，冇 import）
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNkwrLenzC_B7x9F4iMRyruqAlhrw_onU",
  authDomain: "grid-shop-management-system.firebaseapp.com",
  databaseURL: "https://grid-shop-management-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "grid-shop-management-system",
  storageBucket: "grid-shop-management-system.firebasestorage.app",
  messagingSenderId: "311533074982",
  appId: "1:311533074982:web:c490d0344d71b9859204e7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============================================================
   2. 工具函數
   ============================================================ */
const formatHKD = (n) => {
  if (n === null || n === undefined || isNaN(n)) return 'HK$0.00';
  return 'HK$' + Number(n).toFixed(2);
};

const formatDate = (ts) => {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-HK');
};

const formatDateTime = (ts) => {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('zh-HK');
};

const CUBICLE_STATUS = {
  vacant:      { label: '空置',   color: '#6B7280' },
  occupied:    { label: '已租',   color: '#D4AF37' },
  reserved:    { label: '預留',   color: '#3B82F6' },
  overdue:     { label: '逾期',   color: '#EF4444' },
  maintenance: { label: '維修',   color: '#8B5CF6' },
};

const LEASE_STATUS = {
  active:     { label: '生效中', color: '#10B981' },
  pending:    { label: '待簽約', color: '#F59E0B' },
  expired:    { label: '已到期', color: '#6B7280' },
  terminated: { label: '已終止', color: '#EF4444' },
};

/* ============================================================
   3. Auth Context
   ============================================================ */
const AuthContext = createContext(null);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setLoading(false);
    });
    return unsub;
  }, []);

  return (
    <AuthContext.Provider value={{ user, loading }}>
      {children}
    </AuthContext.Provider>
  );
}

const useAuth = () => useContext(AuthContext);

/* ============================================================
   4. 共用元件
   ============================================================ */
function KpiCard({ label, value, icon }) {
  return (
    <div className="relative overflow-hidden glass-card p-6 transition hover:-translate-y-1">
      <div className="absolute -right-4 -top-4 text-6xl opacity-10">{icon}</div>
      <p className="text-sm text-white/60">{label}</p>
      <p className="mt-2 text-3xl font-bold text-white">{value}</p>
      <div className="absolute bottom-0 left-0 h-1 w-full bg-gradient-to-r from-[#D4AF37] to-transparent" />
    </div>
  );
}

function EmptyState({ message = '暫無資料' }) {
  return (
    <div className="flex flex-col items-center justify-center py-12 text-white/40">
      <div className="text-5xl mb-3">📭</div>
      <p className="text-sm">{message}</p>
    </div>
  );
}

function StatusBadge({ status, map }) {
  const cfg = map[status] || { label: status || '—', color: '#6B7280' };
  return (
    <span
      className="inline-block rounded-full px-3 py-1 text-xs font-semibold"
      style={{ background: cfg.color + '30', color: cfg.color, border: `1px solid ${cfg.color}60` }}
    >
      {cfg.label}
    </span>
  );
}

function LoadingSpinner() {
  return (
    <div className="flex items-center justify-center py-12 text-gold">
      <div className="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[#D4AF37]" />
    </div>
  );
}

function ErrorBanner({ error }) {
  if (!error) return null;
  return (
    <div className="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-300">
      ⚠️ {error}
    </div>
  );
}

/* ============================================================
   5. 通用 Firestore Hook
   ============================================================ */
function useCollection(collectionName, options = {}) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let q = db.collection(collectionName);
    if (options.orderBy) {
      q = q.orderBy(options.orderBy, options.orderDir || 'desc');
    }
    if (options.limit) q = q.limit(options.limit);

    const unsub = q.onSnapshot(
      (snap) => {
        setData(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
        setError(null);
      },
      (err) => {
        setError('讀取 ' + collectionName + ' 失敗：' + err.message);
        setLoading(false);
      }
    );
    return unsub;
  }, [collectionName]);

  return { data, loading, error };
}

/* ============================================================
   6. 登入頁
   ============================================================ */
function LoginPage() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [isRegister, setIsRegister] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      if (isRegister) {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({
          email: email,
          displayName: email.split('@')[0],
          role: 'admin',
          kycStatus: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  const handleGoogle = async () => {
    setError('');
    setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const cred = await auth.signInWithPopup(provider);
      const userDoc = await db.collection('users').doc(cred.user.uid).get();
      if (!userDoc.exists) {
        await db.collection('users').doc(cred.user.uid).set({
          email: cred.user.email,
          displayName: cred.user.displayName || cred.user.email.split('@')[0],
          role: 'admin',
          kycStatus: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-md glass-card p-8">
        <h1 className="text-3xl font-bold bg-gradient-to-r from-[#D4AF37] to-[#F5E6A3] bg-clip-text text-transparent text-center">
          Grid Shop
        </h1>
        <p className="text-center text-white/60 text-sm mt-2">格仔鋪營運管理系統</p>

        <form onSubmit={handleSubmit} className="mt-8 space-y-4">
          <div>
            <label className="text-sm text-white/60">電郵</label>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="mt-1 w-full rounded-lg bg-white/5 border border-white/10 px-4 py-3 text-white focus:border-[#D4AF37] focus:outline-none"
            />
          </div>
          <div>
            <label className="text-sm text-white/60">密碼</label>
            <input
              type="password"
              required
              minLength={6}
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              className="mt-1 w-full rounded-lg bg-white/5 border border-white/10 px-4 py-3 text-white focus:border-[#D4AF37] focus:outline-none"
            />
          </div>
          <ErrorBanner error={error} />
          <button
            type="submit"
            disabled={busy}
            className="w-full rounded-lg bg-[#D4AF37] py-3 font-semibold text-black transition hover:bg-[#F5E6A3] disabled:opacity-50"
          >
            {busy ? '處理中...' : isRegister ? '註冊' : '登入'}
          </button>
        </form>

        <div className="mt-4 flex items-center gap-3">
          <div className="flex-1 h-px bg-white/10" />
          <span className="text-xs text-white/40">或</span>
          <div className="flex-1 h-px bg-white/10" />
        </div>

        <button
          onClick={handleGoogle}
          disabled={busy}
          className="mt-4 w-full rounded-lg bg-white py-3 font-semibold text-black transition hover:bg-white/90 disabled:opacity-50"
        >
          🔍 用 Google 登入
        </button>

        <button
          onClick={() => { setIsRegister(!isRegister); setError(''); }}
          className="mt-4 w-full text-sm text-white/60 hover:text-gold"
        >
          {isRegister ? '已有帳號？登入' : '未有帳號？註冊'}
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   7. 側邊欄
   ============================================================ */
const NAV_ITEMS = [
  { key: 'dashboard',   label: '總覽',   icon: '📊' },
  { key: 'cubicles',    label: '格仔',   icon: '📦' },
  { key: 'leases',      label: '租約',   icon: '📝' },
  { key: 'payments',    label: '收租',   icon: '💰' },
  { key: 'consignors',  label: '格主',   icon: '👤' },
  { key: 'products',    label: '商品',   icon: '🏷️' },
  { key: 'pos',         label: 'POS',    icon: '🛒' },
  { key: 'settlements', label: '結算',   icon: '💳' },
  { key: 'reports',     label: '報表',   icon: '📈' },
  { key: 'settings',    label: '設定',   icon: '⚙️' },
];

function Sidebar({ current, onNavigate }) {
  const { user } = useAuth();

  return (
    <aside className="fixed left-0 top-0 h-screen w-64 border-r border-white/10 bg-black/40 backdrop-blur-xl p-4 overflow-y-auto">
      <h1 className="mb-8 text-2xl font-bold bg-gradient-to-r from-[#D4AF37] to-[#F5E6A3] bg-clip-text text-transparent">
        Grid Shop
      </h1>
      <nav className="space-y-1">
        {NAV_ITEMS.map((item) => (
          <button
            key={item.key}
            onClick={() => onNavigate(item.key)}
            className={`w-full flex items-center gap-3 rounded-lg px-4 py-3 text-sm transition text-left ${
              current === item.key
                ? 'bg-[#D4AF37]/20 text-[#F5E6A3] border border-[#D4AF37]/30'
                : 'text-white/60 hover:bg-white/5 hover:text-white'
            }`}
          >
            <span>{item.icon}</span>
            <span>{item.label}</span>
          </button>
        ))}
      </nav>
      <div className="mt-8 pt-4 border-t border-white/10">
        <p className="text-xs text-white/40 truncate">{user?.email || ''}</p>
        <button
          onClick={() => auth.signOut()}
          className="mt-3 w-full text-sm text-red-400 hover:text-red-300 text-left"
        >
          → 登出
        </button>
      </div>
    </aside>
  );
}

/* ============================================================
   8. Dashboard
   ============================================================ */
function DashboardPage() {
  const { data: cubicles, loading, error } = useCollection('cubicles');
  const { data: sales } = useCollection('sales', { orderBy: 'createdAt', limit: 5 });
  const { data: leases } = useCollection('leases', { orderBy: 'createdAt', limit: 5 });

  const stats = useMemo(() => {
    const total = cubicles.length;
    const occupied = cubicles.filter((c) => c.status === 'occupied').length;
    const vacant = cubicles.filter((c) => c.status === 'vacant').length;
    const overdue = cubicles.filter((c) => c.status === 'overdue').length;
    const rate = total > 0 ? ((occupied / total) * 100).toFixed(1) : '0.0';
    return { total, occupied, vacant, overdue, rate };
  }, [cubicles]);

  const activity = useMemo(() => {
    const s = (sales || []).map((x) => ({ ...x, _type: 'sale' }));
    const l = (leases || []).map((x) => ({ ...x, _type: 'lease' }));
    return [...s, ...l].slice(0, 6);
  }, [sales, leases]);

  if (loading) return <LoadingSpinner />;

  return (
    <div className="p-6">
      <h1 className="text-2xl font-bold text-gold mb-6">總覽</h1>
      <ErrorBanner error={error} />

      <div className="grid grid-cols-1 gap-6 md:grid-cols-4">
        <KpiCard label="總格仔數" value={stats.total} icon="📦" />
        <KpiCard label="已租" value={stats.occupied} icon="✅" />
        <KpiCard label="空置" value={stats.vacant} icon="🟡" />
        <KpiCard label="出租率" value={stats.rate + '%'} icon="📈" />
      </div>

      <div className="mt-8 grid grid-cols-1 gap-8 lg:grid-cols-3">
        <div className="lg:col-span-2 glass-card p-6">
          <h2 className="mb-4 text-lg font-semibold text-gold">格仔地圖</h2>
          {cubicles.length === 0 ? (
            <EmptyState message="暫無格仔資料，請先到「格仔」頁新增" />
          ) : (
            <div className="grid grid-cols-8 gap-2">
              {cubicles.map((c) => {
                const cfg = CUBICLE_STATUS[c.status] || CUBICLE_STATUS.vacant;
                return (
                  <div
                    key={c.id}
                    title={`${c.code || ''} · ${cfg.label} · ${formatHKD(c.monthlyRent)}`}
                    className="aspect-square rounded-lg border border-white/10 flex items-center justify-center text-xs font-bold cursor-help"
                    style={{ background: cfg.color + '40', color: '#fff' }}
                  >
                    {c.code || '—'}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="glass-card p-6">
          <h2 className="mb-4 text-lg font-semibold text-gold">最近活動</h2>
          {activity.length === 0 ? (
            <EmptyState message="暫無活動" />
          ) : (
            <div className="space-y-3 text-sm text-white/70">
              {activity.map((a) => (
                <div key={a.id} className="border-b border-white/5 pb-2">
                  {a._type === 'sale' ? (
                    <span>💰 銷售 · {formatHKD(a.totalAmount)}</span>
                  ) : (
                    <span>📝 租約 · {formatHKD(a.monthlyRent)}</span>
                  )}
                  <span className="block text-xs text-white/40">
                    {formatDateTime(a.createdAt)}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   9. 格仔管理
   ============================================================ */
function CubiclesPage() {
  const { data: cubicles, loading, error } = useCollection('cubicles', { orderBy: 'createdAt' });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ code: '', size: 'M', monthlyRent: '', deposit: '', status: 'vacant' });
  const [busy, setBusy] = useState(false);
  const [editId, setEditId] = useState(null);

  const resetForm = () => {
    setForm({ code: '', size: 'M', monthlyRent: '', deposit: '', status: 'vacant' });
    setEditId(null);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.code.trim()) return;
    setBusy(true);
    try {
      const data = {
        code: form.code.trim(),
        size: form.size,
        monthlyRent: Number(form.monthlyRent) || 0,
        deposit: Number(form.deposit) || 0,
        status: form.status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      if (editId) {
        await db.collection('cubicles').doc(editId).update(data);
      } else {
        await db.collection('cubicles').add({
          ...data,
          position: { x: 0, y: 0, z: 0 },
          dimensions: { width: 1, height: 1, depth: 1 },
          images: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      resetForm();
      setShowForm(false);
    } catch (err) {
      alert('儲存失敗：' + err.message);
    } finally {
      setBusy(false);
    }
  };

  const handleEdit = (c) => {
    setForm({
      code: c.code || '',
      size: c.size || 'M',
      monthlyRent: c.monthlyRent ?? '',
      deposit: c.deposit ?? '',
      status: c.status || 'vacant',
    });
    setEditId(c.id);
    setShowForm(true);
  };

  const handleDelete = async (id) => {
    if (!confirm('確定刪除呢個格仔？')) return;
    try {
      await db.collection('cubicles').doc(id).delete();
    } catch (err) {
      alert('刪除失敗：' + err.message);
    }
  };

  const handleStatusChange = async (id, status) => {
    try {
      await db.collection('cubicles').doc(id).update({
        status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (err) {
      alert('更新失敗：' + err.message);
    }
  };

  if (loading) return <LoadingSpinner />;

  return (
    <div className="p-6">
      <div className="flex justify-between items-center mb-6">
        <h1 className="text-2xl font-bold text-gold">格仔管理</h1>
        <button
          onClick={() => { setShowForm(!showForm); resetForm(); }}
          className="rounded-lg bg-[#D4AF37] px-5 py-2 text-sm font-semibold text-black hover:bg-[#F5E6A3]"
        >
          {showForm ? '取消' : '+ 新增格仔'}
        </button>
      </div>

      <ErrorBanner error={error} />

      {showForm && (
        <form onSubmit={handleSubmit} className="glass-card p-6 mb-6 grid grid-cols-1 md:grid-cols-5 gap-4">
          <input
            placeholder="格仔編號 (例：A-01)"
            required
            value={form.code}
            onChange={(e) => setForm({ ...form, code: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white focus:border-[#D4AF37] focus:outline-none"
          />
          <select
            value={form.size}
            onChange={(e) => setForm({ ...form, size: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white"
          >
            <option value="S">S 細</option>
            <option value="M">M 中</option>
            <option value="L">L 大</option>
            <option value="XL">XL 特大</option>
          </select>
          <input
            type="number"
            placeholder="月租 HK$"
            value={form.monthlyRent}
            onChange={(e) => setForm({ ...form, monthlyRent: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white focus:border-[#D4AF37] focus:outline-none"
          />
          <input
            type="number"
            placeholder="按金 HK$"
            value={form.deposit}
            onChange={(e) => setForm({ ...form, deposit: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white focus:border-[#D4AF37] focus:outline-none"
          />
          <button
            type="submit"
            disabled={busy}
            className="rounded-lg bg-[#D4AF37] py-2 font-semibold text-black hover:bg-[#F5E6A3] disabled:opacity-50"
          >
            {busy ? '儲存中...' : editId ? '更新' : '儲存'}
          </button>
        </form>
      )}

      {cubicles.length === 0 ? (
        <EmptyState message="暫無格仔，請新增" />
      ) : (
        <div className="glass-card overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-white/5 text-white/60">
              <tr>
                <th className="text-left p-4">編號</th>
                <th className="text-left p-4">尺寸</th>
                <th className="text-left p-4">月租</th>
                <th className="text-left p-4">按金</th>
                <th className="text-left p-4">狀態</th>
                <th className="text-left p-4">更新時間</th>
                <th className="text-left p-4">操作</th>
              </tr>
            </thead>
            <tbody>
              {cubicles.map((c) => (
                <tr key={c.id} className="border-t border-white/5 hover:bg-white/5">
                  <td className="p-4 font-semibold">{c.code || '—'}</td>
                  <td className="p-4">{c.size || '—'}</td>
                  <td className="p-4">{formatHKD(c.monthlyRent)}</td>
                  <td className="p-4">{formatHKD(c.deposit)}</td>
                  <td className="p-4">
                    <select
                      value={c.status || 'vacant'}
                      onChange={(e) => handleStatusChange(c.id, e.target.value)}
                      className="rounded bg-white/5 border border-white/10 px-2 py-1 text-xs text-white"
                    >
                      {Object.entries(CUBICLE_STATUS).map(([k, v]) => (
                        <option key={k} value={k}>{v.label}</option>
                      ))}
                    </select>
                  </td>

/* ============================================================
   12. POS
   ============================================================ */
function POSPage() {
  const { data: products, loading, error } = useCollection('products');
  const [cart, setCart] = useState([]);
  const [busy, setBusy] = useState(false);
  const [paymentMethod, setPaymentMethod] = useState('cash');

  const addToCart = (p) => {
    setCart((prev) => {
      const found = prev.find((x) => x.id === p.id);
      if (found) return prev.map((x) => (x.id === p.id ? { ...x, qty: x.qty + 1 } : x));
      return [...prev, { ...p, qty: 1 }];
    });
  };

  const removeFromCart = (id) => {
    setCart((prev) => prev.filter((x) => x.id !== id));
  };

  const updateQty = (id, qty) => {
    if (qty <= 0) return removeFromCart(id);
    setCart((prev) => prev.map((x) => (x.id === id ? { ...x, qty } : x)));
  };

  const total = cart.reduce((sum, x) => sum + (x.price || 0) * x.qty, 0);

  const handleCheckout = async () => {
    if (cart.length === 0) return;
    setBusy(true);
    try {
      const saleData = {
        items: cart.map((x) => ({
          productId: x.id,
          productName: x.name,
          cubicleId: x.cubicleId || null,
          cubicleCode: x.cubicleCode || '',
          consignorId: x.consignorId || null,
          quantity: x.qty,
          unitPrice: x.price || 0,
          subtotal: (x.price || 0) * x.qty,
        })),
        totalAmount: total,
        paymentMethod: paymentMethod,
        staffId: auth.currentUser?.uid || null,
        staffEmail: auth.currentUser?.email || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      await db.collection('sales').add(saleData);

      // 扣減庫存
      for (const item of cart) {
        const p = products.find((x) => x.id === item.id);
        if (p && typeof p.stock === 'number') {
          await db.collection('products').doc(item.id).update({
            stock: Math.max(0, p.stock - item.qty),
          });
        }
      }

      setCart([]);
      alert('交易已記錄');
    } catch (err) {
      alert('交易失敗：' + err.message);
    } finally {
      setBusy(false);
    }
  };

  if (loading) return <LoadingSpinner />;

  return (
    <div className="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <h1 className="text-2xl font-bold text-gold mb-6">POS 銷售</h1>
        <ErrorBanner error={error} />
        {products.length === 0 ? (
          <EmptyState message="暫無商品可售，請先到「商品」頁新增" />
        ) : (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {products.map((p) => (
              <button
                key={p.id}
                onClick={() => addToCart(p)}
                className="glass-card p-4 text-left hover:border-[#D4AF37]/50 transition"
              >
                <p className="font-semibold truncate">{p.name || '—'}</p>
                <p className="text-gold mt-1">{formatHKD(p.price)}</p>
                <p className="text-xs text-white/50 mt-1">庫存：{p.stock ?? 0}</p>
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="glass-card p-6 h-fit sticky top-6">
        <h2 className="text-lg font-semibold text-gold mb-4">購物車</h2>
        {cart.length === 0 ? (
          <p className="text-white/40 text-sm">尚未加入商品</p>
        ) : (
          <div className="space-y-3">
            {cart.map((x) => (
              <div key={x.id} className="flex items-center justify-between text-sm gap-2">
                <span className="truncate flex-1">{x.name}</span>
                <input
                  type="number"
                  min="1"
                  value={x.qty}
                  onChange={(e) => updateQty(x.id, Number(e.target.value))}
                  className="w-14 rounded bg-white/5 border border-white/10 px-2 py-1 text-white text-center"
                />
                <span className="text-gold w-20 text-right">{formatHKD((x.price || 0) * x.qty)}</span>
                <button onClick={() => removeFromCart(x.id)} className="text-red-400 text-xs">✕</button>
              </div>
            ))}
            <div className="border-t border-white/10 pt-3 flex justify-between font-semibold">
              <span>總計</span>
              <span className="text-gold">{formatHKD(total)}</span>
            </div>
            <div>
              <label className="text-xs text-white/60">付款方式</label>
              <select
                value={paymentMethod}
                onChange={(e) => setPaymentMethod(e.target.value)}
                className="mt-1 w-full rounded bg-white/5 border border-white/10 px-3 py-2 text-white text-sm"
              >
                <option value="cash">現金</option>
                <option value="alipay">支付寶</option>
                <option value="wechat">微信支付</option>
                <option value="fps">轉數快 FPS</option>
                <option value="payme">PayMe</option>
                <option value="card">信用卡</option>
              </select>
            </div>
            <button
              onClick={handleCheckout}
              disabled={busy}
              className="w-full rounded-lg bg-[#D4AF37] py-3 font-semibold text-black hover:bg-[#F5E6A3] disabled:opacity-50"
            >
              {busy ? '處理中...' : '結帳'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

                <th className="text-left p-4">應付</th>
                <th className="text-left p-4">狀態</th>
                <th className="text-left p-4">操作</th>
              </tr>
            </thead>
            <tbody>
              {settlements.map((s) => (
                <tr key={s.id} className="border-t border-white/5 hover:bg-white/5">
                  <td className="p-4">{s.consignorName || '—'}</td>
                  <td className="p-4 text-xs">{formatDate(s.periodStart)} ~ {formatDate(s.periodEnd)}</td>
                  <td className="p-4">{formatHKD(s.totalSales)}</td>
                  <td className="p-4">{formatHKD(s.totalCommission)}</td>
                  <td className="p-4 text-gold font-semibold">{formatHKD(s.totalPayable)}</td>
                  <td className="p-4">
                    <span className={s.status === 'paid' ? 'text-emerald-400' : 'text-yellow-400'}>
                      {s.status === 'paid' ? '已付款' : '待付款'}
                    </span>
                  </td>
                  <td className="p-4">
                    {s.status !== 'paid' && (
                      <button onClick={() => markPaid(s.id)} className="text-gold text-xs hover:text-gold-light">
                        標記已付
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   14. 收租記錄
   ============================================================ */
function PaymentsPage() {
  const { data, loading, error } = useCollection('payments', { orderBy: 'createdAt' });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ cubicleCode: '', amount: '', method: 'cash', note: '' });
  const [busy, setBusy] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setBusy(true);
    try {
      await db.collection('payments').add({
        cubicleCode: form.cubicleCode.trim(),
        amount: Number(form.amount) || 0,
        method: form.method,
        note: form.note.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setForm({ cubicleCode: '', amount: '', method: 'cash', note: '' });
      setShowForm(false);
    } catch (err) {
      alert('新增失敗：' + err.message);
    } finally {
      setBusy(false);
    }
  };

  if (loading) return <LoadingSpinner />;

  return (
    <div className="p-6">
      <div className="flex justify-between items-center mb-6">
        <h1 className="text-2xl font-bold text-gold">收租記錄</h1>
        <button
          onClick={() => setShowForm(!showForm)}
          className="rounded-lg bg-[#D4AF37] px-5 py-2 text-sm font-semibold text-black hover:bg-[#F5E6A3]"
        >
          {showForm ? '取消' : '+ 新增收租'}
        </button>
      </div>

      <ErrorBanner error={error} />

      {showForm && (
        <form onSubmit={handleSubmit} className="glass-card p-6 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
          <input
            placeholder="格仔編號"
            required
            value={form.cubicleCode}
            onChange={(e) => setForm({ ...form, cubicleCode: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white focus:border-[#D4AF37] focus:outline-none"
          />
          <input
            type="number"
            placeholder="金額 HK$"
            required
            value={form.amount}
            onChange={(e) => setForm({ ...form, amount: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white focus:border-[#D4AF37] focus:outline-none"
          />
          <select
            value={form.method}
            onChange={(e) => setForm({ ...form, method: e.target.value })}
            className="rounded-lg bg-white/5 border border-white/10 px-4 py-2 text-white"
          >
            <option value="cash">現金</option>
            <option value="alipay">支付寶</option>
            <option value="wechat">微信支付</option>
            <option value="fps">轉數快 FPS</option>
            <option value="payme">PayMe</option>
            <option value="card">信用卡</option>
          </select>
          <button
            type="submit"
            disabled={busy}
            className="rounded-lg bg-[#D4AF37] py-2 font-semibold text-black hover:bg-[#F5E6A3] disabled:opacity-50"
          >
            {busy ? '儲存中...' : '儲存'}
          </button>
        </form>
      )}

      {data.length === 0 ? (
        <EmptyState message="暫無收租記錄" />
      ) : (
        <div className="glass-card overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-white/5 text-white/60">
              <tr>
                <th className="text-left p-4">格仔</th>
                <th className="text-left p-4">金額</th>
                <th className="text-left p-4">方式</th>
                <th className="text-left p-4">日期</th>
              </tr>
            </thead>
            <tbody>
              {data.map((p) => (
                <tr key={p.id} className="border-t border-white/5">
                  <td className="p-4">{p.cubicleCode || '—'}</td>
                  <td className="p-4 text-gold">{formatHKD(p.amount)}</td>
                  <td className="p-4">{p.method || '—'}</td>
                  <td className="p-4 text-white/50 text-xs">{formatDateTime(p.createdAt)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   15. 格主列表
   ============================================================ */
function ConsignorsPage() {
  const { data, loading, error } = useCollection('users');
  if (loading) return <LoadingSpinner />;
  return (
    <div className="p-6">
      <h1 className="text-2xl font-bold text-gold mb-6">用戶列表</h1>
      <ErrorBanner error={error} />
      {data.length === 0 ? <EmptyState message="暫無用戶" /> : (
        <div className="glass-card overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-white/5 text-white/60">
              <tr>
                <th className="text-left p-4">名稱</th>
                <th className="text-left p-4">電郵</th>
                <th className="text-left p-4">角色</th>
                <th className="text-left p-4">KYC</th>
                <th className="text-left p-4">建立時間</th>
              </tr>
            </thead>
            <tbody>
              {data.map((u) => (
                <tr key={u.id} className="border-t border-white/5">
                  <td className="p-4">{u.displayName || '—'}</td>
                  <td className="p-4">{u.email || '—'}</td>
                  <td className="p-4">{u.role || '—'}</td>
                  <td className="p-4">{u.kycStatus || '—'}</td>
                  <td className="p-4 text-white/50 text-xs">{formatDate(u.createdAt)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   16. 報表
   ============================================================ */
function ReportsPage() {
  const { data: sales, loading, error } = useCollection('sales', { orderBy: 'createdAt' });
  if (loading) return <LoadingSpinner />;

  const totalRevenue = sales.reduce((s, x) => s + (x.totalAmount || 0), 0);
  const avg = sales.length ? totalRevenue / sales.length : 0;

  return (
    <div className="p-6">
      <h1 className="text-2xl font-bold text-gold mb-6">報表</h1>
      <ErrorBanner error={error} />
      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
        <KpiCard label="總銷售額" value={formatHKD(totalRevenue)} icon="💎" />
        <KpiCard label="交易筆數" value={sales.length} icon="🧾" />
        <KpiCard label="平均交易" value={formatHKD(avg)} icon="📊" />
      </div>

      {sales.length > 0 && (
        <div className="mt-8 glass-card overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-white/5 text-white/60">
              <tr>
                <th className="text-left p-4">時間</th>
                <th className="text-left p-4">商品數</th>
                <th className="text-left p-4">總額</th>
                <th className="text-left p-4">付款方式</th>
              </tr>
            </thead>
            <tbody>
              {sales.map((s) => (
                <tr key={s.id} className="border-t border-white/5">
                  <td className="p-4 text-xs">{formatDateTime(s.createdAt)}</td>
                  <td className="p-4">{(s.items || []).length}</td>
                  <td className="p-4 text-gold">{formatHKD(s.totalAmount)}</td>
                  <td className="p-4">{s.paymentMethod || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   17. 設定
   ============================================================ */
function SettingsPage() {
  const { user } = useAuth();
  return (
    <div className="p-6">
      <h1 className="text-2xl font-bold text-gold mb-6">設定</h1>
      <div className="glass-card p-6 space-y-3 text-sm">
        <p><span className="text-white/50">當前帳號：</span>{user?.email || '—'}</p>
        <p><span className="text-white/50">UID：</span><span className="text-xs">{user?.uid || '—'}</span></p>
        <p><span className="text-white/50">專案：</span>grid-shop-management-system</p>
        <p><span className="text-white/50">資料庫：</span>Cloud Firestore (asia-southeast1)</p>
      </div>
    </div>
  );
}

/* ============================================================
   18. 主應用
   ============================================================ */
function App() {
  const { user, loading } = useAuth();
  const [page, setPage] = useState('dashboard');

  if (loading) return <LoadingSpinner />;
  if (!user) return <LoginPage />;

  const pages = {
    dashboard:   <DashboardPage />,
    cubicles:    <CubiclesPage />,
    leases:      <LeasesPage />,
    payments:    <PaymentsPage />,
    consignors:  <ConsignorsPage />,
    products:    <ProductsPage />,
    pos:         <POSPage />,
    settlements: <SettlementsPage />,
    reports:     <ReportsPage />,
    settings:    <SettingsPage />,
  };

  return (
    <div className="flex min-h-screen">
      <Sidebar current={page} onNavigate={setPage} />
      <main className="ml-64 flex-1">{pages[page]}</main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <AuthProvider>
    <App />
  </AuthProvider>
);
</script>
</body>
</html>
